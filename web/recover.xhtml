<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Account Recovery</title>
</h:head>

<h:body>

    <h1>Account Recovery</h1>

    <h:form>

        <h:messages style="color:red" />

        <h:outputLabel value="Registered Email:" />
        <h:inputText value="#{recoveryController.email}"
                     required="true" />

        <br /><br />

        <h:commandButton value="Send Recovery Code"
                         action="#{recoveryController.sendRecoveryCode}" />

    </h:form>

</h:body>
</html>
