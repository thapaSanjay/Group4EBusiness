<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>User Registration</title>
</h:head>

<h:body>

    <h1>User Registration</h1>

    <h:form id="registrationForm">

        <h:messages
            errorStyle="color:red"
            infoStyle="color:green"
            showSummary="true"
            showDetail="false" />

        <h:panelGrid columns="2">

            <h:outputLabel value="First Name:" for="firstName" />
            <h:inputText id="firstName"
                         value="#{registrationController.firstName}"
                         required="true"
                         requiredMessage="First name is required." />

            <h:outputLabel value="Last Name:" for="lastName" />
            <h:inputText id="lastName"
                         value="#{registrationController.lastName}"
                         required="true"
                         requiredMessage="Last name is required." />

            <h:outputLabel value="Username:" for="username" />
            <h:inputText id="username"
                         value="#{registrationController.username}"
                         required="true"
                         requiredMessage="Username is required." />

            <h:outputLabel value="Email:" for="email" />
            <h:inputText id="email"
                         value="#{registrationController.email}"
                         required="true"
                         requiredMessage="Email is required."
                         validatorMessage="Please enter a valid email address.">

                <f:validateRegex
                    pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" />

            </h:inputText>

            <h:outputLabel value="Password:" for="password" />
            <h:inputSecret id="password"
                            value="#{registrationController.password}"
                            required="true"
                            requiredMessage="Password is required."
                            validatorMessage="Password must be at least 6 characters.">

                 <f:validateLength minimum="6" />

            </h:inputSecret>

        </h:panelGrid>

        <br />

        <h:commandButton value="Register"
                         action="#{registrationController.register}" />

    </h:form>

</h:body>
</html>
