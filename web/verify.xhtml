<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Verify Registration</title>
</h:head>

<h:body>

    <h1>Verify Registration</h1>

    <h:form>

        <h:messages style="color:red" />

        <h:panelGrid columns="2">

            <h:outputLabel value="Verification Code:" />

            <h:inputText value="#{verificationController.code}"
                         required="true" />

        </h:panelGrid>

        <br />

        <h:commandButton value="Verify"
                         action="#{verificationController.verify}" />

    </h:form>

</h:body>
</html>
