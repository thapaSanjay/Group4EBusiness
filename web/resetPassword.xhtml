<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Reset Password</title>
</h:head>

<h:body>

    <h1>Reset Password</h1>

    <h:panelGroup rendered="#{not empty sessionScope.recoveryCode}">
        <p>
            Test recovery code:
            <strong>#{sessionScope.recoveryCode}</strong>
        </p>
    </h:panelGroup>

    <h:form>

        <h:messages style="color:red" />

        <h:panelGrid columns="2">

            <h:outputLabel value="Recovery Code:" />
            <h:inputText value="#{recoveryController.recoveryCode}"
                         required="true" />

            <h:outputLabel value="New Password:" />
            <h:inputSecret value="#{recoveryController.newPassword}"
                           required="true" />

        </h:panelGrid>

        <br />

        <h:commandButton value="Reset Password"
                         action="#{recoveryController.resetPassword}" />

    </h:form>

</h:body>
</html>
