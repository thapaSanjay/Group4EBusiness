<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Reset Password</title>
</h:head>

<h:body>

    <h1>Reset Password</h1>

    <h2>Account Details</h2>

    <h:panelGrid columns="2" border="1">

        <h:outputText value="First Name:" />
        <h:outputText value="#{sessionScope.recoveryFirstName}" />

        <h:outputText value="Last Name:" />
        <h:outputText value="#{sessionScope.recoveryLastName}" />

        <h:outputText value="Username:" />
        <h:outputText value="#{sessionScope.recoveryUsername}" />

    </h:panelGrid>

    <br />

    <h:form>

        <h:messages style="color:red" />

        <h:panelGrid columns="2">

            <h:outputLabel value="Recovery Code:" />
            <h:inputText value="#{recoveryController.recoveryCode}"
                         required="true"
                         requiredMessage="Recovery code is required." />

            <h:outputLabel value="New Password:" />
            <h:inputSecret value="#{recoveryController.newPassword}"
                           required="true"
                           requiredMessage="New password is required." />

        </h:panelGrid>

        <br />

        <h:commandButton value="Reset Password"
                         action="#{recoveryController.resetPassword}" />

    </h:form>

</h:body>
</html>
