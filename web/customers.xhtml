<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Customer Management</title>
</h:head>

<h:body>

    <h1>Customer Management</h1>

<h:link value="Home"
        outcome="index" />


    <h:form id="customerForm">

        <h:messages
            errorStyle="color:red"
            infoStyle="color:green"
            showSummary="true"
            showDetail="false" />

        <h:panelGrid columns="2">

            <h:outputLabel value="First Name:" for="firstName" />

            <h:inputText id="firstName"
                         value="#{customerController.firstName}"
                         required="true"
                         requiredMessage="First name is required." />


            <h:outputLabel value="Last Name:" for="lastName" />

            <h:inputText id="lastName"
                         value="#{customerController.lastName}"
                         required="true"
                         requiredMessage="Last name is required." />


            <h:outputLabel value="Email:" for="email" />

            <h:inputText id="email"
                         value="#{customerController.email}"
                         required="true"
                         requiredMessage="Email is required."
                         validatorMessage="Please enter a valid email address.">

                <f:validateRegex
                    pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" />

            </h:inputText>


            <h:outputLabel value="Phone:" for="phone" />

            <h:inputText id="phone"
                         value="#{customerController.phone}"
                         required="true"
                         requiredMessage="Phone number is required."
                         validatorMessage="Please enter a valid phone number.">

                <f:validateRegex pattern="^[0-9 +()-]{8,20}$" />

            </h:inputText>


            <h:outputLabel value="Address:" for="address" />

            <h:inputText id="address"
                         value="#{customerController.address}"
                         required="true"
                         requiredMessage="Address is required." />

        </h:panelGrid>

        <br />

        <h:commandButton value="Create Customer"
                         action="#{customerController.createCustomer}" />

    </h:form>

    <hr />

    <h2>Customer List</h2>

    <h:dataTable value="#{customerController.customers}"
                 var="customer"
                 border="1">

        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{customer.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">First Name</f:facet>
            <h:outputText value="#{customer.firstName}" />
        </h:column>

        <h:column>
            <f:facet name="header">Last Name</f:facet>
            <h:outputText value="#{customer.lastName}" />
        </h:column>

        <h:column>
            <f:facet name="header">Email</f:facet>
            <h:outputText value="#{customer.email}" />
        </h:column>

        <h:column>
            <f:facet name="header">Phone</f:facet>
            <h:outputText value="#{customer.phone}" />
        </h:column>

        <h:column>
            <f:facet name="header">Address</f:facet>
            <h:outputText value="#{customer.address}" />
        </h:column>

    </h:dataTable>

</h:body>
</html>
