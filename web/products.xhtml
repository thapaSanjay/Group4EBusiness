<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Product Management</title>
</h:head>

<h:body>

    <h1>Product Management</h1>

    <h:form id="productForm">

        <h:messages
            errorStyle="color:red"
            infoStyle="color:green"
            showSummary="true"
            showDetail="false" />

        <h:panelGrid columns="2">

            <h:outputLabel value="Product Type:" for="productType" />

            <h:selectOneMenu id="productType"
                             value="#{productController.productType}"
                             required="true"
                             requiredMessage="Please select a product type.">

                <f:selectItem itemLabel="Select Type"
                              itemValue="#{null}"
                              noSelectionOption="true" />

                <f:selectItem itemLabel="Laptop"
                              itemValue="Laptop" />

                <f:selectItem itemLabel="Smartphone"
                              itemValue="Smartphone" />

            </h:selectOneMenu>


            <h:outputLabel value="Brand:" for="brand" />

            <h:inputText id="brand"
                         value="#{productController.brand}"
                         required="true"
                         requiredMessage="Brand is required." />


            <h:outputLabel value="Model:" for="model" />

            <h:inputText id="model"
                         value="#{productController.model}"
                         required="true"
                         requiredMessage="Model is required." />


            <h:outputLabel value="Display Size:" for="displaySize" />

            <h:inputText id="displaySize"
                         value="#{productController.displaySize}"
                         required="true"
                         requiredMessage="Display size is required."
                         converterMessage="Display size must be a number."
                         validatorMessage="Display size must be greater than 0.">

                <f:validateDoubleRange minimum="0.1" />

            </h:inputText>


            <h:outputLabel value="Weight:" for="weight" />

            <h:inputText id="weight"
                         value="#{productController.weight}"
                         required="true"
                         requiredMessage="Weight is required."
                         converterMessage="Weight must be a number."
                         validatorMessage="Weight must be greater than 0.">

                <f:validateDoubleRange minimum="0.1" />

            </h:inputText>


            <h:outputLabel value="Operating System:" for="os" />

            <h:inputText id="os"
                         value="#{productController.operatingSystem}"
                         required="true"
                         requiredMessage="Operating system is required." />


            <h:outputLabel value="Camera:" for="camera" />

            <h:inputText id="camera"
                         value="#{productController.camera}"
                         required="true"
                         requiredMessage="Camera information is required." />


            <h:outputLabel value="WiFi:" for="wifi" />

            <h:inputText id="wifi"
                         value="#{productController.wifi}"
                         required="true"
                         requiredMessage="WiFi information is required." />


            <h:outputLabel value="Stock Quantity:" for="stock" />

            <h:inputText id="stock"
                         value="#{productController.stockQuantity}"
                         required="true"
                         requiredMessage="Stock quantity is required."
                         converterMessage="Stock quantity must be a whole number."
                         validatorMessage="Stock quantity cannot be negative.">

                <f:validateLongRange minimum="0" />

            </h:inputText>


            <h:outputLabel value="Network Interface:" />
            <h:inputText value="#{productController.networkInterface}" />

            <h:outputLabel value="Hard Drive:" />
            <h:inputText value="#{productController.hardDrive}" />

            <h:outputLabel value="Optical Drive:" />
            <h:inputText value="#{productController.opticalDrive}" />

            <h:outputLabel value="Cellular Connectivity:" />
            <h:inputText value="#{productController.cellularConnectivity}" />

            <h:outputLabel value="Location:" />
            <h:inputText value="#{productController.location}" />

            <h:outputLabel value="SIM Card:" />
            <h:inputText value="#{productController.simCard}" />

        </h:panelGrid>

        <br />

        <h:commandButton value="Create Product"
                         action="#{productController.createProduct}" />

    </h:form>

    <hr />

    <h2>Product Stock</h2>

    <h:dataTable value="#{productController.products}"
                 var="product"
                 border="1">

        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{product.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Brand</f:facet>
            <h:outputText value="#{product.brand}" />
        </h:column>

        <h:column>
            <f:facet name="header">Model</f:facet>
            <h:outputText value="#{product.model}" />
        </h:column>

        <h:column>
            <f:facet name="header">OS</f:facet>
            <h:outputText value="#{product.operatingSystem}" />
        </h:column>

        <h:column>
            <f:facet name="header">Stock</f:facet>
            <h:outputText value="#{product.stockQuantity}" />
        </h:column>

    </h:dataTable>

</h:body>
</html>
