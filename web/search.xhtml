<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Search</title>
</h:head>

<h:body>

<h:link value="Home"
        outcome="index" />

    <h1>Search</h1>

    <h2>Search Products</h2>

    <h:form>

        <h:inputText value="#{searchController.productKeyword}" />

        <h:commandButton value="Search Product"
                         action="#{searchController.searchProducts}" />

        <h:dataTable value="#{searchController.productResults}"
                     var="product"
                     border="1">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{product.id}" />
            </h:column>

            <h:column>
                <f:facet name="header">Brand</f:facet>
                <h:outputText value="#{product.brand}" />
            </h:column>

            <h:column>
                <f:facet name="header">Model</f:facet>
                <h:outputText value="#{product.model}" />
            </h:column>

            <h:column>
                <f:facet name="header">Stock</f:facet>
                <h:outputText value="#{product.stockQuantity}" />
            </h:column>

        </h:dataTable>

    </h:form>

    <hr />

    <h2>Search Customers</h2>

    <h:form>

        <h:inputText value="#{searchController.customerKeyword}" />

        <h:commandButton value="Search Customer"
                         action="#{searchController.searchCustomers}" />

        <h:dataTable value="#{searchController.customerResults}"
                     var="customer"
                     border="1">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{customer.id}" />
            </h:column>

            <h:column>
                <f:facet name="header">Name</f:facet>
                <h:outputText value="#{customer.firstName} #{customer.lastName}" />
            </h:column>

            <h:column>
                <f:facet name="header">Email</f:facet>
                <h:outputText value="#{customer.email}" />
            </h:column>

        </h:dataTable>

    </h:form>

    <hr />

    <h2>Search Order</h2>

    <h:form>

        <h:inputText value="#{searchController.orderId}" />

        <h:commandButton value="Search Order"
                         action="#{searchController.searchOrder}" />

        <h:panelGroup rendered="#{searchController.orderResult != null}">

            <h:panelGrid columns="2">

                <h:outputText value="Order ID:" />
                <h:outputText value="#{searchController.orderResult.id}" />

                <h:outputText value="Customer:" />
                <h:outputText value="#{searchController.orderResult.customer.firstName} #{searchController.orderResult.customer.lastName}" />

                <h:outputText value="Product:" />
                <h:outputText value="#{searchController.orderResult.product.brand} #{searchController.orderResult.product.model}" />

                <h:outputText value="Quantity:" />
                <h:outputText value="#{searchController.orderResult.quantity}" />

            </h:panelGrid>

        </h:panelGroup>

    </h:form>

</h:body>
</html>
